<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joke Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="flex justify-between p-4 shadow nav-bg">
    <h2 class="font-bold text-[20px] text-primary md:text-[24px]">JokeGen</h2>
    <div class="flex justify-between gap-4 items-center">
      <p class="text-[12px] font-semibold text-secondary md:text-[16px]">Bad jokes. Good mood</p>
      <button id="toggle-btn"><ion-icon name="moon" class="text-[20px accent md:text-[24px]"></ion-icon></button>
    </nav>
  </div> 
  <main class="flex flex-col flex-1 items-center justify-center main-bg">
    <h1 class="text-[22px] font-bold p-4 mt-4 text-primary md:text-[30px]">Need a Laugh?</h1>
    <p class="w-full max-w-[350px] text-center leading-[1.5em] mb-10 text-secondary px-4 md:text-[20px] md:max-w-[400px] md:leading-[2em]">Get a random joke, instantly. Because life's better when you laugh!</p>
  
  <div class="flex flex-col items-center w-full max-w-[300px] border border-gray-200 p-4 rounded-3xl div-bg relative md:max-w-[500px]">
    <h1 class="font-bold mb-4 accent text-[24px] md:text-[28px]" id="jokes-id"></h1>
    <p class="text-center w-full text-[18px] text-primary p-4 mb-4 md:text-[22px]" id="jokes"></p>
    <button class="p-2 rounded-xl main-bg mb-4 accent border border-gray-200 font-semibold md:text-[20px] md:p-3" id="btn">Get New Joke</button>
  </div>
  </main>
  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
